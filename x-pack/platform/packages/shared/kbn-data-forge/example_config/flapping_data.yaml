---
elasticsearch:
  host: "http://localhost:9204"
  installKibanaUser: false

kibana:
  host: "http://localhost:5604"
  installAssets: true

indexing:
  dataset: "fake_stack"
  interval: 10000 # 10 seconds

# The sequence of states and their duration
schedule:
  - template: "bad"
    duration: "2m"
  - template: "good"
    duration: "2m"
